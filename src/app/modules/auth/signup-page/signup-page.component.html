<div class="w-full max-w-4xl mx-auto p-2">
  <app-novela-stage
    [arte]="arte"
    [mensaje]="mensaje"
    [esDecision]="esDecision"
    [opciones]="opciones"
    [esEntrada]="esEntrada"
    [placeholderEntrada]="placeholderEntrada"
    [tipoEntrada]="campo?.tipo ?? 'text'"
    [autocompletarEntrada]="campo?.autocompletar ?? 'off'"
    [valorEntradaInicial]="valorEntrada"
    [mostrarSiguiente]="mostrarSiguiente"
    [etiquetaSiguiente]="esFinal ? 'Iniciar sesión' : 'Siguiente'"
    [formatoLibre]="true"
    (siguiente)="siguiente()"
    (opcionSeleccionada)="elegirOpcion($event)"
    (entradaEnviada)="enviarEntrada($event)"></app-novela-stage>

  @if (errorMotor) {
    <p class="p-2 text-center text-sm text-red-700 bg-red-50" role="alert">{{ errorMotor }}</p>
  }

  <p class="text-center text-sm text-gray-600 mt-3">
    ¿Ya tienes una cuenta?
    <a class="text-primary-600 hover:underline" routerLink="/auth/login">Inicia sesión</a>
  </p>
</div>
