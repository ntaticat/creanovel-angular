<div class="w-full" [class]="modo === 'preview' ? 'bg-white' : 'bg-gray-900 text-white'">
  @if (cargando) {
    <p class="p-6 text-center" [class.text-black]="modo === 'preview'">Cargando...</p>
  } @else if (sinContenido) {
    <p class="p-6 text-center">
      {{
        modo === 'preview'
          ? 'Esta novela todavía no tiene un borrador.'
          : 'Esta novela todavía no tiene una versión publicada.'
      }}
    </p>
  } @else {
    <app-novela-stage
      [arte]="arteActual"
      [autor]="autorActual"
      [mensaje]="mensajeActual"
      [esDecision]="esDecision"
      [esEntrada]="esEntrada"
      [placeholderEntrada]="placeholderEntrada"
      [opciones]="opciones"
      [esExplora]="esExplora"
      [zonas]="zonas"
      [resaltarZonasInicial]="modo === 'preview'"
      [ubicacionNombre]="ubicacionNombre"
      [mostrarMochila]="tieneObjetos"
      [mochila]="mochila"
      [hud]="hud"
      [permitirPantallaCompleta]="true"
      [mostrarSiguiente]="esConversacion && !finDeNovela"
      [finDeNovela]="finDeNovela"
      [final]="finalVista"
      [mostrarLogros]="tieneLogros"
      [logros]="logrosVista"
      [toastLogro]="toastLogro"
      (empezarDeNuevo)="empezarDeNuevo()"
      [minijuego]="minijuego"
      [minijuegoClave]="presentacion"
      (minijuegoTerminado)="terminarMinijuego($event)"
      (siguiente)="siguiente()"
      (opcionSeleccionada)="elegirOpcion($event)"
      (objetoUsado)="usarObjeto($event)"
      (entradaEnviada)="enviarEntrada($event)"></app-novela-stage>

    @if (errorMotor) {
      <p class="p-2 text-center text-sm text-red-700 bg-red-50" role="alert">{{ errorMotor }}</p>
    }

    @if (modo === 'preview' && hayDefiniciones) {
      <app-motor-debug-panel
        [definiciones]="definiciones"
        [estado]="estado"
        [recursoActualId]="recursoActual?.recursoId"
        (estadoCambiado)="reemplazarEstado($event)"
        (reiniciar)="reiniciar()"
        (irAlInicio)="irAlInicio()"></app-motor-debug-panel>
    }
  }
</div>
