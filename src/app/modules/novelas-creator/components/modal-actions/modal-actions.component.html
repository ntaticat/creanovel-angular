<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 p-2 sm:p-4"
  (click)="closeModal.emit()">
  <div
    class="card relative w-full max-h-[92dvh] overflow-y-auto p-4 pt-10 sm:p-5 {{ sizeClass }}"
    (click)="$event.stopPropagation()">
    <button
      type="button"
      class="absolute right-3 top-3 rounded-lg p-1.5 text-gray-400 hover:bg-gray-100 hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
      (click)="closeModal.emit()"
      aria-label="Cerrar">
      <fa-icon [icon]="faXmark"></fa-icon>
    </button>
    <ng-content></ng-content>
  </div>
</div>
