<form
  class="w-full flex flex-wrap"
  [formGroup]="escenaForm"
  (ngSubmit)="onSubmitEscena()">
  <div class="w-full pb-3">
    <h2 class="font-semibold text-gray-800">{{ editando ? 'Editar Escena' : 'Registrar Escena' }}</h2>
  </div>
  <div class="w-full pb-3">
    <label class="w-full text-sm font-medium text-gray-600" for="escena-identificador">Identificador</label>
    <input
      id="escena-identificador"
      type="text"
      class="input mt-1"
      placeholder="Identificador de la escena"
      name="identificador"
      formControlName="identificador" />
  </div>
  <div class="w-full pb-3">
    <span class="w-full text-sm font-medium text-gray-600">Etiquetas</span>
    <div class="mt-1">
      <app-etiquetas-input
        [etiquetas]="escenaForm.value.etiquetas"
        [sugerencias]="etiquetasExistentes"
        (etiquetasChange)="onEtiquetasChange($event)"></app-etiquetas-input>
    </div>
  </div>
  @if (!editando) {
    <div class="w-full pb-4 flex gap-4 text-sm text-gray-600">
      <label class="flex items-center gap-2">
        <input type="checkbox" formControlName="primerEscena" />
        Primera escena
      </label>
      <label class="flex items-center gap-2">
        <input type="checkbox" formControlName="ultimaEscena" />
        Última escena
      </label>
    </div>
  }
  <div class="w-full flex justify-end">
    <button [disabled]="guardando" class="btn-primary" type="submit">
      @if (guardando) {
        <app-spinner size="sm" />
      }
      {{ guardando ? 'Guardando...' : editando ? 'Guardar' : 'Crear' }}
    </button>
  </div>
</form>
