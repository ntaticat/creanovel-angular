<form
  class="card w-full flex flex-wrap justify-center"
  [formGroup]="novelaForm"
  (ngSubmit)="onSubmitNovela()">
  <div class="w-full p-3 text-center border-b border-gray-200">
    <h2 class="font-semibold text-gray-800">Editar Novela</h2>
  </div>
  <div class="w-6/12 p-3">
    <label class="w-full text-sm font-medium text-gray-600" for="">Título</label>
    <input
      type="text"
      class="input mt-1"
      name="titulo"
      placeholder="Título de la novela"
      formControlName="titulo" />
  </div>
  <div class="w-6/12 p-3">
    <label class="w-full text-sm font-medium text-gray-600" for="">Descripción</label>
    <input
      type="text"
      class="input mt-1"
      name="descripcion"
      placeholder="Descripción de la novela"
      formControlName="descripcion" />
  </div>
  <div class="w-full p-3">
    <label class="w-full text-sm font-medium text-gray-600" for="">Portada</label>
    <input
      type="file"
      accept="image/*"
      class="mt-1 text-sm text-gray-600"
      (change)="onFileSelected($event)" />
  </div>
  <div class="w-4/12 p-3">
    <button [disabled]="guardando" class="btn-primary w-full" type="submit">
      @if (guardando) {
        <app-spinner size="sm" />
      }
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</form>
