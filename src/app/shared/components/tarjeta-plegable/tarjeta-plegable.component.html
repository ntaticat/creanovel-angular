<div
  class="card mb-2 overflow-hidden"
  [class.ring-2]="resaltada"
  [class.ring-yellow-400]="resaltada">
  <div class="flex items-stretch">
    <!-- Toda la línea es el botón: en el móvil es un blanco grande para tocar -->
    <button
      type="button"
      class="flex-1 min-w-0 flex items-center gap-2 px-3 py-2.5 text-left hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-primary-600"
      [attr.aria-expanded]="abierta"
      [attr.aria-controls]="id"
      (click)="alternar()">
      <fa-icon class="w-3 shrink-0 text-gray-400" [icon]="abierta ? faAbierta : faPlegada"></fa-icon>
      <span class="min-w-0 flex-1">
        <span class="block text-sm font-medium text-gray-800 truncate">{{ titulo }}</span>
        @if (resumen && !abierta) {
          <span class="block text-xs text-gray-500 truncate">{{ resumen }}</span>
        }
      </span>
      @if (advertencia && !abierta) {
        <span class="badge-warning shrink-0" [title]="advertencia">
          <fa-icon [icon]="faAdvertencia"></fa-icon>
          <span class="hidden sm:inline">{{ advertencia }}</span>
        </span>
      }
    </button>
    <div class="flex items-center gap-1 pr-2 shrink-0">
      <ng-content select="[acciones]"></ng-content>
    </div>
  </div>

  <div [id]="id" class="px-3 pb-3 pt-2 border-t border-gray-100" [hidden]="!abierta">
    <ng-content></ng-content>
  </div>
</div>
