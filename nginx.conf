server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # El service worker y sus descriptores NUNCA se cachean en el navegador: si ngsw.json o ngsw-worker.js quedan viejos,
  # la app instalada no ve los despliegues nuevos. Lo mismo para el index y el manifiesto (no llevan hash en el nombre).
  location = /ngsw-worker.js      { add_header Cache-Control "no-cache"; }
  location = /safety-worker.js    { add_header Cache-Control "no-cache"; }
  location = /worker-basic.min.js { add_header Cache-Control "no-cache"; }
  location = /ngsw.json           { add_header Cache-Control "no-cache"; }
  # nginx no conoce la extensión .webmanifest: sin este tipo lo serviría como application/octet-stream.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  location = /index.html          { add_header Cache-Control "no-cache"; }

  # Los JS/CSS compilados llevan el hash en el nombre: pueden cachearse para siempre.
  location ~* ^/[^/]+\.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Fallback de SPA: cualquier ruta del router de Angular devuelve el index.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
